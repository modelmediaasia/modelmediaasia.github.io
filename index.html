<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="麻豆传媒 ModelMedia 官方域名与最新访问线路发布页。">
    <meta name="theme-color" content="#f7f8fa">
    <title>麻豆传媒 ModelMedia - 域名发布页</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f7f8fa;
            --card: #fff;
            --text: #17181c;
            --sub-text: #72757d;
            --muted: #92959d;
            --border: #e8e9ed;
            --blue: #2563eb;
            --green: #22c55e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(circle at 50% -10%, rgba(37, 99, 235, .07), transparent 35%),
                var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:focus-visible {
            outline: 3px solid rgba(37, 99, 235, .45);
            outline-offset: 4px;
        }

        .page {
            width: min(820px, calc(100% - 32px));
            margin: 0 auto;
            padding: 75px 0 38px;
        }

        .header {
            margin-bottom: 36px;
            text-align: center;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 17px;
            padding: 7px 12px;
            border: 1px solid #e4e7ec;
            border-radius: 999px;
            background: rgba(255, 255, 255, .8);
            color: #60646d;
            font-size: 12px;
            backdrop-filter: blur(10px);
        }

        .header-badge::before {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 4px rgba(34, 197, 94, .1);
            content: "";
        }

        h1 {
            margin: 0 0 13px;
            font-size: clamp(32px, 5vw, 44px);
            font-weight: 750;
            letter-spacing: -1.5px;
            line-height: 1.15;
        }

        .header p {
            max-width: 530px;
            margin: 0 auto;
            color: var(--sub-text);
            font-size: 14px;
            line-height: 1.8;
        }

        .publish-link {
            color: var(--blue);
            font-weight: 600;
            text-decoration: underline;
            text-decoration-color: rgba(37, 99, 235, .3);
            text-underline-offset: 3px;
        }

        .utm-info {
            margin-top: 8px !important;
            color: #15803d !important;
            font-size: 12px !important;
        }

        .domain-panel {
            padding: 25px;
            border: 1px solid var(--border);
            border-radius: 21px;
            background: rgba(255, 255, 255, .9);
            box-shadow: 0 12px 35px rgba(20, 25, 35, .035), 0 2px 7px rgba(20, 25, 35, .02);
            backdrop-filter: blur(14px);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 4px;
            padding: 0 3px 20px;
            border-bottom: 1px solid #eeeeef;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .panel-icon {
            display: grid;
            width: 40px;
            height: 40px;
            flex: 0 0 auto;
            place-items: center;
            border-radius: 11px;
            background: #f1f4f8;
            color: var(--blue);
            font-size: 19px;
        }

        .panel-title h2 {
            margin: 0 0 3px;
            font-size: 18px;
            font-weight: 700;
        }

        .panel-title p {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
        }

        .domain-count {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .domain-list {
            display: flex;
            flex-direction: column;
        }

        .domain-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 21px 5px;
            border-bottom: 1px solid #f0f1f3;
            border-radius: 12px;
            transition: background .2s ease, transform .2s ease, padding .2s ease;
        }

        .domain-item:last-child {
            border-bottom: 0;
        }

        .domain-item:hover {
            padding-right: 10px;
            padding-left: 10px;
            transform: translateX(3px);
            background: #fafbfc;
        }

        .domain-main {
            width: 205px;
            flex: 0 0 auto;
        }

        .domain-name {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 7px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -.3px;
        }

        .domain-name::before {
            width: 6px;
            height: 6px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, .08);
            content: "";
        }

        .domain-type {
            color: var(--muted);
            font-size: 11px;
        }

        .domain-info {
            min-width: 0;
            flex: 1;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: 600;
            line-height: 1;
        }

        .tag-blue {
            color: #2563eb;
            background: #eff6ff;
        }

        .tag-green {
            color: #16a34a;
            background: #f0fdf4;
        }

        .tag-purple {
            color: #7c3aed;
            background: #f5f3ff;
        }

        .domain-description {
            color: #777b84;
            font-size: 12px;
            line-height: 1.65;
        }

        .domain-action {
            flex: 0 0 auto;
        }

        .visit-btn {
            display: inline-flex;
            min-width: 78px;
            height: 34px;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 0 12px;
            border: 1px solid #e1e3e7;
            border-radius: 8px;
            background: #fff;
            color: #33363d;
            font-size: 12px;
            font-weight: 600;
            transition: color .2s ease, background .2s ease, border-color .2s ease;
        }

        .domain-item:hover .visit-btn {
            border-color: #111827;
            background: #111827;
            color: #fff;
        }

        .arrow {
            transition: transform .2s ease;
        }

        .domain-item:hover .arrow {
            transform: translateX(3px);
        }

        .footer {
            padding-top: 25px;
            color: #9a9da5;
            font-size: 11px;
            text-align: center;
        }

        @media (max-width: 700px) {
            .page {
                width: min(calc(100% - 24px), 560px);
                padding-top: 50px;
            }

            .domain-panel {
                padding: 20px;
            }

            .domain-item {
                align-items: flex-start;
                flex-wrap: wrap;
                gap: 12px;
            }

            .domain-main {
                width: calc(100% - 80px);
            }

            .domain-info {
                flex-basis: 100%;
            }

            .domain-action {
                position: absolute;
                top: 20px;
                right: 5px;
            }

            .domain-item:hover {
                padding-right: 5px;
                padding-left: 5px;
                transform: none;
            }
        }

        @media (max-width: 480px) {
            .page {
                width: calc(100% - 18px);
                padding-top: 38px;
            }

            .header {
                margin-bottom: 27px;
            }

            h1 {
                font-size: 31px;
                letter-spacing: -1px;
            }

            .header p {
                font-size: 13px;
            }

            .domain-panel {
                padding: 15px;
                border-radius: 17px;
            }

            .panel-header {
                padding-bottom: 17px;
            }

            .panel-icon {
                width: 37px;
                height: 37px;
                font-size: 17px;
            }

            .panel-title h2 {
                font-size: 16px;
            }

            .domain-item {
                padding: 18px 3px;
            }

            .domain-main {
                width: calc(100% - 70px);
            }

            .domain-name {
                font-size: 15px;
            }

            .domain-description {
                font-size: 11.5px;
            }

            .domain-action {
                right: 3px;
            }

            .visit-btn {
                min-width: 68px;
                height: 32px;
                padding: 0 10px;
                font-size: 11px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="header">
            <div class="header-badge">ModelMedia 官方域名</div>
            <h1>麻豆传媒 ModelMedia</h1>
            <p>
                建议收藏网址发布页
                <a class="publish-link tracked-link" href="https://mdgirl.site">https://mdgirl.site</a>，
                最新地址会在这里更新。
            </p>
            <p class="utm-info" id="utmInfo" hidden>来源参数已保留到访问链接</p>
        </header>

        <main>
            <section class="domain-panel" aria-labelledby="domain-heading">
                <div class="panel-header">
                    <div class="panel-title">
                        <div class="panel-icon" aria-hidden="true">🌐</div>
                        <div>
                            <h2 id="domain-heading">可用访问线路</h2>
                            <p>选择线路进入 ModelMedia</p>
                        </div>
                    </div>
                    <div class="domain-count">共 2 条线路</div>
                </div>

                <div class="domain-list">
                    <a class="domain-item tracked-link" href="https://modelmedia.asia">
                        <div class="domain-main">
                            <div class="domain-name">modelmedia.asia</div>
                            <div class="domain-type">永久域名</div>
                        </div>
                        <div class="domain-info">
                            <div class="tags">
                                <span class="tag tag-blue">永久域名</span>
                                <span class="tag tag-purple">国际线路</span>
                            </div>
                            <div class="domain-description">ModelMedia 官方永久域名与国际访问线路。</div>
                        </div>
                        <div class="domain-action">
                            <span class="visit-btn">访问 <span class="arrow" aria-hidden="true">→</span></span>
                        </div>
                    </a>

                    <a class="domain-item tracked-link" href="https://modelmedia.site">
                        <div class="domain-main">
                            <div class="domain-name">modelmedia.site</div>
                            <div class="domain-type">最新全球可访问线路</div>
                        </div>
                        <div class="domain-info">
                            <div class="tags">
                                <span class="tag tag-green">最新线路</span>
                                <span class="tag tag-blue">全球可访问</span>
                            </div>
                            <div class="domain-description">当前最新发布的全球访问线路，访问受限时可优先尝试。</div>
                        </div>
                        <div class="domain-action">
                            <span class="visit-btn">访问 <span class="arrow" aria-hidden="true">→</span></span>
                        </div>
                    </a>
                </div>
            </section>
        </main>

        <footer class="footer">请收藏网址发布页，以便随时获取最新线路。</footer>
    </div>

    <script>
        function initializeUTMTracking() {
            const params = new URLSearchParams(window.location.search);
            const utmParams = [...params.entries()].filter(([key]) =>
                key.startsWith('utm_') || key === 'utm'
            );

            if (utmParams.length === 0) return;

            document.getElementById('utmInfo').hidden = false;

            document.querySelectorAll('a.tracked-link').forEach(link => {
                const url = new URL(link.href);
                utmParams.forEach(([key, value]) => {
                    url.searchParams.set(key === 'utm' ? 'utm_source' : key, value);
                });
                link.href = url.toString();
            });
        }

        document.addEventListener('DOMContentLoaded', initializeUTMTracking);
    </script>

    <!-- Privacy-friendly analytics by Plausible -->
    <script async src="https://plausible.io/js/pa-xOGdmkMUYUlK7_nQspFMM.js"></script>
    <script>
        window.plausible = window.plausible || function () {
            (plausible.q = plausible.q || []).push(arguments);
        };
        window.plausible.init = window.plausible.init || function (i) {
            window.plausible.o = i || {};
        };
        window.plausible.init();
    </script>
</body>
</html>
